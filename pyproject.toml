[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "jlens-reasoning"
version = "0.1.0"
description = "Research tooling for Jacobian Lens reasoning benchmarks"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "huggingface-hub",
  "jlens",
  "numpy",
  "torch",
  "transformers>=5.5",
]

[project.optional-dependencies]
experiment = [
  "datasets",
  "ipykernel",
  "wandb",
]

[dependency-groups]
dev = [
  "nbformat",
  "pyyaml",
  "pytest",
  "ruff",
]

[tool.uv.sources]
jlens = { git = "https://github.com/anthropics/jacobian-lens", rev = "581d398613e5602a5af361e1c34d3a92ea82ba8e" }
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["jlens_reasoning*", "experiments*"]
namespaces = false

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP", "W"]
ignore = ["E501"]
